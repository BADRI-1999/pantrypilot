services:
  - type: web
    name: pantrypilot-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      npm install
      npm run build --workspace apps/api
      npm run db:generate --workspace apps/api
      npm run db:migrate:prod --workspace apps/api
      npm run db:seed:prod --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
